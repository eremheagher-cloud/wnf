name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 360
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: System Information
      run: |
        Write-Host "=== ENIGMANO RDP DEPLOYMENT ===" -ForegroundColor Green
        Write-Host "Instance Number: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
        Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow
        Write-Host "Workflow: $env:GITHUB_WORKFLOW" -ForegroundColor Yellow
        
        Write-Host "`n=== SYSTEM SPECIFICATIONS ===" -ForegroundColor Cyan
        Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory
        Get-WmiObject -Class Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors
        
    - name: Enable RDP
      run: |
        Write-Host "Enabling Remote Desktop..." -ForegroundColor Green
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        
    - name: Create User Account
      run: |
        Write-Host "Creating new Windows user account..." -ForegroundColor Green

        $Username = "Rafael"
        $Password = "rafael2637"

        Write-Host "Configuring local password policy..." -ForegroundColor Yellow

        $SecConfig = "$env:TEMP\secpol.cfg"

        secedit /export /cfg $SecConfig /quiet

        if (-not (Test-Path $SecConfig)) {
          Write-Error "Could not export the local security policy."
          exit 1
        }

        $Config = Get-Content $SecConfig

        if ($Config -match 'PasswordComplexity') {
          $Config = $Config -replace 'PasswordComplexity\s*=\s*\d+', 'PasswordComplexity = 0'
        }
        else {
          $Config += 'PasswordComplexity = 0'
        }

        if ($Config -match 'MinimumPasswordLength') {
          $Config = $Config -replace 'MinimumPasswordLength\s*=\s*\d+', 'MinimumPasswordLength = 1'
        }
        else {
          $Config += 'MinimumPasswordLength = 1'
        }

        Set-Content -Path $SecConfig -Value $Config -Encoding Unicode

        Write-Host "Applying local security policy..." -ForegroundColor Yellow

        secedit /configure `
          /db "$env:TEMP\secpol.sdb" `
          /cfg $SecConfig `
          /areas SECURITYPOLICY `
          /quiet

        Start-Sleep -Seconds 3

        Write-Host "Creating user Rafael..." -ForegroundColor Yellow

        $existingUser = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue

        if ($existingUser) {
          Write-Host "The user Rafael already exists. Updating password..." -ForegroundColor Yellow

          $SecurePassword = ConvertTo-SecureString $Password -AsPlainText -Force

          Set-LocalUser `
            -Name $Username `
            -Password $SecurePassword
        }
        else {
          $SecurePassword = ConvertTo-SecureString $Password -AsPlainText -Force

          New-LocalUser `
            -Name $Username `
            -Password $SecurePassword `
            -FullName "Rafael" `
            -Description "Conta criada pelo workflow" `
            -PasswordNeverExpires
        }

        Write-Host "Adding Rafael to Remote Desktop Users..." -ForegroundColor Yellow

        Add-LocalGroupMember `
          -Group "Remote Desktop Users" `
          -Member $Username `
          -ErrorAction SilentlyContinue

        Write-Host ""
        Write-Host "========================================" -ForegroundColor Green
        Write-Host " WINDOWS ACCOUNT CREATED SUCCESSFULLY" -ForegroundColor Green
        Write-Host "========================================" -ForegroundColor Green
        Write-Host "Username: Rafael" -ForegroundColor Yellow
        Write-Host "Password: rafael2637" -ForegroundColor Yellow
        Write-Host "========================================" -ForegroundColor Green

        Remove-Item $SecConfig -Force -ErrorAction SilentlyContinue
        
    - name: Install Tailscale (Silent)
      run: |
        Write-Host "Downloading Tailscale ARM64..." -ForegroundColor Green

        $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.102.4-arm64.msi"
        $installerPath = "$env:TEMP\tailscale.msi"

        Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

        if (-not (Test-Path $installerPath)) {
          Write-Error "Tailscale installer was not downloaded."
          exit 1
        }

        Write-Host "Installing Tailscale silently..." -ForegroundColor Green

        $process = Start-Process `
          -FilePath "msiexec.exe" `
          -ArgumentList "/i `"$installerPath`" /quiet /norestart" `
          -Wait `
          -PassThru

        if ($process.ExitCode -ne 0) {
          Write-Error "Tailscale installation failed. Exit code: $($process.ExitCode)"
          exit 1
        }

        Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

        Write-Host "Tailscale installed successfully!" -ForegroundColor Green
        
    - name: Start Tailscale
      run: |
        Write-Host "Starting Tailscale service..." -ForegroundColor Green

        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

        if (-not (Test-Path $tailscaleExe)) {
          Write-Error "Tailscale executable was not found."
          exit 1
        }

        $service = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue

        if ($null -eq $service) {
          Write-Error "Tailscale Windows service was not found."
          exit 1
        }

        if ($service.Status -ne "Running") {
          Start-Service -Name "Tailscale"
          Start-Sleep -Seconds 5
        }

        Write-Host "Tailscale service: $((Get-Service -Name 'Tailscale').Status)" -ForegroundColor Yellow

        Write-Host "Connecting Tailscale..." -ForegroundColor Green

        & $tailscaleExe up `
          --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
          --hostname="enigmano-${{ github.run_id }}" `
          --unattended=true

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Tailscale failed to connect. Exit code: $LASTEXITCODE"
          & $tailscaleExe status
          exit 1
        }

        Write-Host "Tailscale connection command completed." -ForegroundColor Green
        
    - name: Get Tailscale IP
      run: |
        Write-Host "Waiting for Tailscale IPv4 address..." -ForegroundColor Yellow

        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
        $tsIP = $null

        for ($i = 1; $i -le 60; $i++) {

          $tsIP = & $tailscaleExe ip -4 2>$null

          if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($tsIP)) {
            $tsIP = $tsIP.Trim()
            break
          }

          Write-Host "Waiting for Tailscale... attempt $i/60" -ForegroundColor Yellow

          Start-Sleep -Seconds 2
        }

        if ([string]::IsNullOrWhiteSpace($tsIP)) {
          Write-Host "Tailscale did not provide an IPv4 address." -ForegroundColor Red
          Write-Host "`n=== TAILSCALE STATUS ===" -ForegroundColor Cyan
          & $tailscaleExe status

          Write-Host "`n=== TAILSCALE IP ===" -ForegroundColor Cyan
          & $tailscaleExe ip

          exit 1
        }

        Write-Host "Tailscale IP: $tsIP" -ForegroundColor Green

        echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
        
    - name: Install Google Chrome (Direct)
      run: |
        Write-Host "Downloading Google Chrome..." -ForegroundColor Green

        $chromeUrl = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
        $installerPath = "$env:TEMP\chrome_installer.exe"

        Invoke-WebRequest -Uri $chromeUrl -OutFile $installerPath

        if (-not (Test-Path $installerPath)) {
          Write-Error "Chrome installer was not downloaded."
          exit 1
        }

        Write-Host "Installing Google Chrome silently..." -ForegroundColor Green

        $process = Start-Process `
          -FilePath $installerPath `
          -ArgumentList "/silent /install" `
          -Wait `
          -PassThru

        Write-Host "Chrome installer exit code: $($process.ExitCode)" -ForegroundColor Yellow

        Start-Sleep -Seconds 5

        if (Test-Path $installerPath) {
          Write-Host "Removing Chrome installer..." -ForegroundColor Yellow

          $removed = $false

          for ($i = 1; $i -le 10; $i++) {
            try {
              Remove-Item $installerPath -Force -ErrorAction Stop
              $removed = $true
              Write-Host "Chrome installer removed successfully." -ForegroundColor Green
              break
            }
            catch {
              Write-Host "File is still in use. Attempt $i/10..." -ForegroundColor Yellow
              Start-Sleep -Seconds 2
            }
          }

          if (-not $removed) {
            Write-Warning "Chrome installer could not be removed, but the installation step will continue."
          }
        }

        if ($process.ExitCode -ne 0) {
          Write-Error "Google Chrome installation failed. Exit code: $($process.ExitCode)"
          exit 1
        }

        Write-Host "Google Chrome installed successfully!" -ForegroundColor Green
        
    - name: Install 7-Zip (Direct)
      run: |
        Write-Host "Downloading 7-Zip ARM64..." -ForegroundColor Green

        $zipUrl = "https://github.com/ip7z/7zip/releases/download/26.03/7z2603-arm64.exe"
        $installerPath = "$env:TEMP\7z-installer.exe"

        Invoke-WebRequest -Uri $zipUrl -OutFile $installerPath

        if (-not (Test-Path $installerPath)) {
          Write-Error "7-Zip installer was not downloaded."
          exit 1
        }

        Write-Host "Installing 7-Zip silently..." -ForegroundColor Green

        $process = Start-Process `
          -FilePath $installerPath `
          -ArgumentList "/S" `
          -Wait `
          -PassThru

        Write-Host "7-Zip installer exit code: $($process.ExitCode)" -ForegroundColor Yellow

        Start-Sleep -Seconds 3

        if (Test-Path $installerPath) {
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
        }

        if ($process.ExitCode -ne 0) {
          Write-Error "7-Zip installation failed. Exit code: $($process.ExitCode)"
          exit 1
        }

        Write-Host "7-Zip installed successfully!" -ForegroundColor Green
        
    - name: Connection Details
      run: |
        Write-Host "`n=== CONNECTION DETAILS (TAILSCALE) ===" -ForegroundColor Green
        Write-Host "╔══════════════════════════════════════╗" -ForegroundColor Cyan
        Write-Host "║         ENIGMANO RDP ACCESS          ║" -ForegroundColor Cyan  
        Write-Host "╠══════════════════════════════════════╣" -ForegroundColor Cyan
        Write-Host "║ Host: $env:TAILSCALE_IP              ║" -ForegroundColor White
        Write-Host "║ Username: Rafael                     ║" -ForegroundColor White
        Write-Host "║ Password: rafael2637                 ║" -ForegroundColor White
        Write-Host "╚══════════════════════════════════════╝" -ForegroundColor Cyan
        
        Write-Host "`nConnection Instructions:" -ForegroundColor Yellow
        Write-Host "1. Install Tailscale on your device (phone, tablet, Mac, Linux)" -ForegroundColor White
        Write-Host "2. Log in with the same Tailscale account" -ForegroundColor White
        Write-Host "3. Open Remote Desktop app and enter the IP above" -ForegroundColor White
        Write-Host "4. Use the provided credentials" -ForegroundColor White
        
    - name: Keep Session Alive
      run: |
        Write-Host "`n=== SESSION ACTIVE ===" -ForegroundColor Green
        Write-Host "EnigMano RDP instance is now running!" -ForegroundColor Cyan
        Write-Host "Instance will remain active for up to 6 hours." -ForegroundColor Yellow
        Write-Host "Do not close this window to maintain the connection." -ForegroundColor Red
        
        $counter = 0

        while ($true) {
          $counter++

          Write-Host "Session active - Heartbeat #$counter ($(Get-Date))" -ForegroundColor Green
          
          $tsStatus = & "C:\Program Files\Tailscale\tailscale.exe" status

          if ($tsStatus -match "active") {
            Write-Host "Tailscale status: ACTIVE" -ForegroundColor Green
          }
          else {
            Write-Host "Tailscale status: ERROR - Restarting..." -ForegroundColor Red

            & "C:\Program Files\Tailscale\tailscale.exe" up `
              --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
              --hostname="enigmano-${{ github.run_id }}" `
              --unattended=true
          }
          
          Start-Sleep -Seconds 60
        }
